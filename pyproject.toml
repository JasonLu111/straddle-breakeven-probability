[project]
name = "straddle-breakeven-probability-lab"
version = "0.1.0"
description = "A volatility-regime and probability-based research framework for long straddle strategies"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
